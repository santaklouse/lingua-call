server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app needs camera/microphone; do not block them with restrictive policies.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|wasm|woff2?|png|jpg|jpeg|svg|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
